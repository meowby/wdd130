                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main class="contact">
        <h1> Contact Us</h1>
        <section class="company-info">
            <div class="t-align">
                <h2> Company Information</h2>
                <address>
                    White Adventures <br>
                    123 River Road
                    Rexburg, ID 83440
                </address>
                <p>Phone: <a href="tel:+15555550123">(555) 555-0123</a></p>
                <p>Email:<a
                      href="mailto:info@whitewateradventures.com">info@whitewateradventures.com</a>
                </p>
            </div>
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d3108.8771761665353!2d-106.1100633!3d38.8123675!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x871534542e6c8597%3A0xfffcaa8adf249078!2sAmerican%20Adventure%20Expeditions%20-%20Whitewater%20Rafting!5e0!3m2!1sen!2sph!4v1791194274360!5m2!1sen!2sph"
              width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>
        </section>

        <section class="team">
            <h2>Meet Our Team</h2>
            <div class="team-gallery">
                <figure>
                    <img src="images/female1.jpg" alt="Portrait of Maria Santos">
                    <figcaption>Maria Santos<br><span>Owner &amp; Head Guide</span></figcaption>
                </figure>
                <figure>
                    <img src="images/male1.jpg" alt="Portrait of Jake Ramos">
                    <figcaption>Jake Ramos<br><span>Safety Coordinator</span></figcaption>
                </figure>
                <figure>
                    <img src="images/female2.jpg" alt="Portrait of Ana Cruz">
                    <figcaption>Ana Cruz<br><span>Reservations Manager</span></figcaption>
                </figure>
            </div>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>
            <form action="#" method="post">
                <div class="field">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="field">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <fieldset>
                    <legend>Purpose of Message</legend>
                    <label><input type="radio" name="purpose" value="general" checked> General
                        Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation
                        Question</label>
                    <label><input type="radio" name="purpose" value="suggestion"> Website
                        Suggestion</label>
                </fieldset>

                <div class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>

                <label class="checkbox">
                    <input type="checkbox" name="newsletter" value="yes">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Whitewater Adventures | All Rights Reserved</p>
