<!doctype html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
      content="Contact Whitewater Adventures to ask about rafting trips, make a reservation, or send feedback. Find our address, phone, email, map, and meet our team.">
    <meta name="author" content="Abby De Ocampo">
    <title>Contact Us - Whitewater Adventures</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header> <img src="images/z-wwr-blue.jpg" alt="Whitewater Adventures Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main class="contact">
        <h1> Contact Us</h1>
        <section class="company-info">
            <div class="t-align">
                <h2> Company Information</h2>
                <address>
                    White Adventures <br>
                    123 River Road
                    Rexburg, ID 83440
                </address>
                <p>Phone: <a href="tel:+15555550123">(555) 555-0123</a></p>
                <p>Email:<a
                      href="mailto:info@whitewateradventures.com">info@whitewateradventures.com</a>
                </p>
            </div>
            <iframe src="https://maps.google.com/maps?q=38.8123675,-106.1055572&z=15&output=embed"
              title="Map showing the Whitewater Adventures location" loading="lazy" allowfullscreen
              referrerpolicy="no-referrer-when-downgrade"></iframe>
        </section>
        </section>

        <section class="team">
            <h2>Meet Our Team</h2>
            <div class="team-gallery">
                <figure>
                    <img src="images/female1.jpg" alt="Portrait of Maria Santos">
                    <figcaption>Maria Santos<br><span>Owner &amp; Head Guide</span></figcaption>
                </figure>
                <figure>
                    <img src="images/male1.jpg" alt="Portrait of Jake Ramos">
                    <figcaption>Jake Ramos<br><span>Safety Coordinator</span></figcaption>
                </figure>
                <figure>
                    <img src="images/female2.jpg" alt="Portrait of Ana Cruz">
                    <figcaption>Ana Cruz<br><span>Reservations Manager</span></figcaption>
                </figure>
            </div>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>
            <form action="#" method="post">
                <div class="field">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="field">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <fieldset>
                    <legend>Purpose of Message</legend>
                    <label for="general">
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        General Inquiry
                    </label>

                    <label for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div class="field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>

                <label class="checkbox">
                    <input type="checkbox" name="newsletter" value="yes">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Whitewater Adventures | All Rights Reserved</p>

        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
                <img src="images/facebook.svg" alt="Facebook">
            </a>

            <a href="https://www.instagram.com/">
                <img src="images/instagram.svg" alt="Instagram">
            </a>

            <a href="https://www.tiktok.com/">
                <img src="images/tictok-bw.svg" alt="TikTok">
            </a>
        </nav>
    </footer>

</body>

</html>
